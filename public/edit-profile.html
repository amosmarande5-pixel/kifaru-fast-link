<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - Kifaru Fast Link</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="edit-profile.css">
</head>
<body>

<header class="page-header">
  <button id="backBtn" class="icon-btn" title="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <h1>Edit Profile</h1>
</header>

<main>
  <section class="edit-section">
    <div class="avatar-large" id="previewAvatar">-</div>

    <label class="field-label">Avatar color</label>
    <div class="color-swatches" id="colorSwatches">
      <button class="swatch" data-color="#1e1e1e"></button>
      <button class="swatch" data-color="#ff7a3d"></button>
      <button class="swatch" data-color="#3ddc97"></button>
      <button class="swatch" data-color="#4a7dff"></button>
      <button class="swatch" data-color="#c94adf"></button>
      <button class="swatch" data-color="#e8c48c"></button>
    </div>
  </section>

  <section class="edit-section">
    <label class="field-label" for="fullNameInput">Full name</label>
    <input type="text" id="fullNameInput" class="text-field" placeholder="Full name">
    <p class="error-msg" id="nameError"></p>
    <button class="save-btn" id="saveNameBtn">Save name</button>
  </section>

  <section class="edit-section">
    <label class="field-label">Change password</label>
    <input type="password" id="currentPassword" class="text-field" placeholder="Current password">
    <input type="password" id="newPassword" class="text-field" placeholder="New password">
    <input type="password" id="confirmPassword" class="text-field" placeholder="Confirm new password">
    <p class="error-msg" id="passwordError"></p>
    <p class="success-msg" id="passwordSuccess"></p>
    <button class="save-btn" id="savePasswordBtn">Update password</button>
  </section>
</main>

<script src="edit-profile.js"></script>
</body>
</html>
