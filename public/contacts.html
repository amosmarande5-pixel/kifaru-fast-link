<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts - Kifaru Fast Link</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="contacts.css">
<link rel="stylesheet" href="bottom-nav.css">
</head>
<body>

<div class="screen active has-bottom-nav">
  <header class="page-header">
    <h1>Contacts</h1>
  </header>

  <div class="search-container">
    <div class="search-input-wrapper">
      <input type="text" id="searchUserInput" placeholder="Search by Unique ID (e.g. KFL-A1B2C3D4)">
      <button id="searchUserBtn" class="add-btn">Search</button>
    </div>
  </div>

  <div id="searchResults"></div>

  <div id="contactList" class="contact-list">
    <p class="empty-state" id="emptyState">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
      No contacts yet. Tap the + button and enter someone's Unique ID to start chatting.
    </p>
  </div>

  <button id="addContactBtn" class="fab clip-br-sm" title="Add contact">+</button>
</div>

<div id="addContactModal" class="modal">
  <div class="modal-box clip-tl">
    <h3>Add contact</h3>
    <input type="text" id="newContactId" placeholder="Their Unique ID (e.g. KFL-A1B2C3D4)">
    <input type="text" id="newContactName" placeholder="Nickname (optional)">
    <p class="error-msg" id="addContactError"></p>
    <div class="modal-actions">
      <button id="cancelAddContact" class="secondary-btn">Cancel</button>
      <button id="confirmAddContact">Add</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" data-page="dashboard.html">
    <svg viewBox="0 0 24 24"><path d="M4 12l8-8 8 8M6 10v10h12V10"/></svg>
    <span>Chats</span>
  </button>
  <button class="nav-item" data-page="status.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <span>Status</span>
  </button>
  <button class="nav-item" data-page="calls.html">
    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    <span>Calls</span>
  </button>
  <button class="nav-item active" data-page="contacts.html">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><path d="M16 11c2.2 0 4 1.8 4 4"/></svg>
    <span>Contacts</span>
  </button>
  <button class="nav-item" data-page="profile.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    <span>Profile</span>
  </button>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="bottom-nav.js"></script>
<script src="contacts.js"></script>

</body>
</html>
