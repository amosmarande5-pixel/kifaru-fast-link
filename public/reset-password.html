<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Kifaru Fast Link</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reset.css">
</head>
<body class="centered-body">

<div class="auth-container clip-tl">
  <div class="reset-container">
    <h2>Set New Password</h2>
    <p class="reset-intro">Enter your new password below.</p>

    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="New password" required minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
      <button type="submit">Reset Password</button>
      <p class="error-msg" id="resetError"></p>
      <p class="success-msg" id="resetSuccess"></p>
    </form>

    <p class="switch-link-spaced">
      <a href="index.html">Back to Log In</a>
    </p>
  </div>
</div>

<script src="reset-password.js"></script>
</body>
</html>
